services:
  cafedebugdb:
    container_name: cafedebugdb
    image: mysql:8.0
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: cafedebug-mysql-local
    ports:
      - "3307:3306"
  
  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-dev-access-key}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-dev-secret-key}"
      RUSTFS_REGION: "us-east-1"
      RUSTFS_VOLUMES: "/data"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "error"
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  rustfs-init:
    image: amazon/aws-cli:2.27.41
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null; do echo waiting for rustfs; sleep 2; done;
        for bucket in cafedebug-uploads cafedebug-images cafedebug-bucket breakingbad-bucket; do
          aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$${bucket}" >/dev/null 2>&1 || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$${bucket}";
          aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket "$${bucket}" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::$${bucket}/*\"}]}";
        done;
        echo "RustFS buckets ensured."
    environment:
      AWS_ACCESS_KEY_ID: "${RUSTFS_ACCESS_KEY:-dev-access-key}"
      AWS_SECRET_ACCESS_KEY: "${RUSTFS_SECRET_KEY:-dev-secret-key}"

  cafedebug-api:
    container_name: cafedebug-backend.api
    image: ${CAFEDEBUG_API_IMAGE_REPOSITORY:-jnathany/cafedebug-backend-api}:${CAFEDEBUG_API_IMAGE_TAG:-latest}
    ports:
      - "${CAFEDEBUG_API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CafedebugConnectionStringMySQL: "Server=cafedebugdb;Port=3306;Database=${MYSQL_DATABASE:-cafedebug-mysql-local};User=root;Password=${MYSQL_ROOT_PASSWORD:-root};"
      JwtSettings__Issuer: ${JWT_ISSUER:-https://api.cafedebug.com.br}
      JwtSettings__Audience: ${JWT_AUDIENCE:-https://cafedebug.com.br}
      JwtSettings__SigningKey: ${JWT_SIGNING_KEY:-change-this-local-dev-signing-key-min-32-chars}
      JwtSettings__ValidForMinutes: ${JWT_VALID_FOR_MINUTES:-15}
      JwtSettings__RefreshTokenValidForMinutes: ${JWT_REFRESH_VALID_FOR_MINUTES:-10080}
      Storage__AWS__S3__ServiceUrl: http://rustfs:9000
      Storage__AWS__S3__Bucket: cafedebug-uploads
      Storage__AWS__S3__Region: us-east-1
      Storage__AWS__S3__BaseUrl: http://localhost:${CAFEDEBUG_API_PORT:-8080}/cafedebug-uploads
      Storage__AWS__S3__ForcePathStyle: "true"
      Storage__AWS__S3__UseHttp: "true"
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-dev-access-key}
      AWS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-dev-secret-key}
      SMTP_SERVER: localhost
      SMTP_PORT: 25
      SMTP_USERNAME: dev
      SMTP_PASSWORD: dev
      SMTP_FROM_EMAIL: dev@localhost
      SMTP_FROM_NAME: CafeDebug Dev
    depends_on:
      cafedebugdb:
        condition: service_started
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  rustfs-data:
